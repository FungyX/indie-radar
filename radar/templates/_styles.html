<style>
  body { margin:0; padding:0; background:#1b2838; font-family: Arial, Helvetica, sans-serif; color:#c7d5e0; }
  a { color:#66c0f4; text-decoration:none; }
  .wrap { width:100%; background:#1b2838; padding:24px 0; }
  .container { width:640px; max-width:100%; margin:0 auto; }
  .label { font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:#8f98a0; }
  .h1 { font-size:26px; color:#ffffff; font-weight:bold; margin:0; }
  .section-title { font-size:15px; letter-spacing:2px; text-transform:uppercase; color:#ffffff; font-weight:bold; padding:28px 0 12px; border-bottom:1px solid #2a475e; }
  .card { background:#16202d; border-radius:4px; margin-top:14px; }
  .card-pad { padding:18px 20px; }
  .muted { color:#8f98a0; font-size:12px; }
  .title { font-size:18px; color:#ffffff; font-weight:bold; }
  .quote { font-size:13px; color:#c7d5e0; font-style:italic; border-left:3px solid #66c0f4; padding:2px 0 2px 10px; margin:10px 0 0; }
  .summary { font-size:13px; color:#c7d5e0; line-height:1.5; margin-top:10px; }
  .stat-num { font-size:20px; color:#ffffff; font-weight:bold; }
  .stat-lbl { font-size:10px; letter-spacing:1px; text-transform:uppercase; color:#8f98a0; }
  .pill { display:inline-block; background:#2a475e; color:#c7d5e0; font-size:11px; padding:3px 8px; border-radius:2px; margin:0 4px 4px 0; }
  .score { display:inline-block; background:#4c6b22; color:#beee11; font-size:12px; font-weight:bold; padding:4px 8px; border-radius:2px; }
  .score.mid { background:#5c4a1e; color:#ffc82c; }
  .bar-bg { background:#2a3f5a; height:8px; border-radius:2px; }
  .bar { background:#66c0f4; height:8px; border-radius:2px; }
  .kv td { font-size:13px; padding:5px 0; border-bottom:1px solid #22303f; vertical-align:top; }
  .kv td.k { color:#8f98a0; width:42%; }
  .kv td.v { color:#ffffff; text-align:right; }
  .up { color:#a4d007; } .down { color:#e05a4f; }
  .btn { display:inline-block; background:#1a9fff; background:linear-gradient(90deg,#06bfff,#2d73ff); color:#ffffff !important; font-size:13px; padding:8px 14px; border-radius:2px; margin:0 6px 6px 0; }
  .btn.ghost { background:#2a475e; color:#c7d5e0 !important; }
  .capsule { width:184px; height:86px; border-radius:2px; display:block; }
  .capsule-empty { width:184px; height:86px; border-radius:2px; background:#2a475e; color:#fff; font-weight:bold; font-size:13px; text-align:center; line-height:86px; overflow:hidden; }
  .chart { width:100%; max-width:600px; display:block; margin-top:14px; border:0; }
  .footer { font-size:11px; color:#61686d; text-align:center; padding:28px 20px; line-height:1.6; }
  .nav { font-size:13px; padding-bottom:14px; }
  .nav a { margin-right:16px; }
  @media (max-width:660px){ .container{ padding:0 16px; box-sizing:border-box; } .capsule,.capsule-empty{ width:120px; height:56px; line-height:56px; font-size:11px; } }
</style>
