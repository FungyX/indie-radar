name: Follow / unfollow game

# Opening an issue titled "follow <steam id or link>" or "unfollow <...>" edits
# config/followed_games.txt. Only issues opened by the repo owner are accepted.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  follow:
    if: github.event.issue.user.login == github.repository_owner && (startsWith(github.event.issue.title, 'follow') || startsWith(github.event.issue.title, 'unfollow'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update followed games
        id: apply
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          msg=$(python -m radar.follow "$TITLE")
          echo "msg=$msg" >> "$GITHUB_OUTPUT"
          git config user.name "indie-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/followed_games.txt
          git diff --cached --quiet || git commit -m "$TITLE"
          git pull --rebase --autostash
          git push
      - name: Reply and close
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ steps.apply.outputs.msg }}
        run: gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --comment "$MSG"
