name: Daily report

on:
  schedule:
    # 05:45 and 06:45 UTC. Only the first one at or after 07:30 Prague time runs,
    # so the report arrives around 8:00 in both winter (CET) and summer (CEST).
    - cron: "45 5 * * *"
    - cron: "45 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run now even if today's report was already sent"
        type: boolean
        default: true
      rescan:
        description: "Process today's posts again (if an earlier run today went wrong)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Build report
        id: build
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GAMALYTIC_API_KEY: ${{ secrets.GAMALYTIC_API_KEY }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
        run: python -m radar.main ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }} ${{ (github.event_name == 'workflow_dispatch' && inputs.rescan) && '--rescan' || '' }}

      - name: Save data
        if: steps.build.outputs.ran == 'true'
        run: |
          git config user.name "indie-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Daily report $(date -u +%F)"
          git pull --rebase --autostash
          git push

      - uses: actions/upload-pages-artifact@v3
        if: steps.build.outputs.ran == 'true'
        with:
          path: site

      - id: deploy
        if: steps.build.outputs.ran == 'true'
        uses: actions/deploy-pages@v4

      - name: Send email
        if: steps.build.outputs.ran == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
        run: python -m radar.mailer
